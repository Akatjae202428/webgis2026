<html>
<head>
  
  <!-- OpenLayers CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">

  <!-- LayerSwitcher CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.2/dist/ol-layerswitcher.css">

  <!-- OpenLayers JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>

  <!-- LayerSwitcher JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.2/dist/ol-layerswitcher.js"></script>

  <!-- give html/body a height so the map can fill the remaining space -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    h1 {
      margin: 8px 12px;
    }
  </style>
  
<title>Chapter 7: Web-based Mapping Using OpenLayers </title>
</head>
<body>
<h1>Chapter 7: Web-based Mapping Using OpenLayers</h1>
<h1>Author: Anaya Elias</h1>
<div id="map" class="map" style="width:100%; flex:1;"></div>

<script>
var latitude=35.306840;
var longitude=-80.73200;
var latlong=ol.proj.fromLonLat([longitude,latitude]);
var zoomLevel=4;
  var basegroup = new ol.layer.Group({
'title': 'Base Maps',
layers: []
});
  var osm = new ol.layer.Tile({
title: 'OpenStreetMap',
type: 'base',
visible: true,
source: new ol.source.OSM()
});
basegroup.getLayers().push(osm); //add the layer to the layer group

var googlemap = new ol.layer.Tile({
title: 'Google Map',
type: 'base',
visible: true,
source: new ol.source.XYZ({
url: `https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=MYAPIKEYHEREk&callback=initialize`
})
});
basegroup.getLayers().push(googlemap);

// ===== WMS layer 1 (Elevation) =====
var wms1 = new ol.layer.Tile({
title: 'Elevation',
source: new ol.source.TileWMS({
url:
'https://elevation.nationalmap.gov/arcgis/services/3DEPElevation/ImageServer/WMSServer',
params: {'LAYERS': '3DEPElevation:Hillshade Elevation Tinted', 'TILED': true},
transition: 0
})
});

// ===== WMS layer 2 (2021 Land Cover) =====
var wms2 = new ol.layer.Tile({
title: 'Land Cover',
source: new ol.source.TileWMS({
url: 'https://www.mrlc.gov/geoserver/mrlc_display/NLCD_2021_Land_Cover_L48/wms',
params: {'LAYERS': 'NLCD_2021_Land_Cover_L48', 'TILED': true},
transition: 0
})
});

// ===== Overlay group for the WMS layers =====
var overlaygroup = new ol.layer.Group({
'title': 'Overlay',
layers: []
}); //create an empty layer group
overlaygroup.getLayers().push(wms1);
overlaygroup.getLayers().push(wms2);

// ===== GeoJSON vector layer (US States) =====
var geojsonSource1 = new ol.source.Vector({
url:
'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/refs/heads/master/data/geojson/us-states.json',
format: new ol.format.GeoJSON()
});

//Define a style with transparent fill and a colored stroke
var polygonStyle = new ol.style.Style({
fill: new ol.style.Fill({
color: 'rgba(255, 255, 255, 0)' // Fully transparent fill (rgba(255, 255, 255, 0))
}),
stroke: new ol.style.Stroke({
color: '#FF0000', // Red border
width: 2
})
});

//Create a vector layer
var geojsonLayer1 = new ol.layer.Vector({
title: 'US States',
source: geojsonSource1,
style: polygonStyle
});

overlaygroup.getLayers().push(geojsonLayer1);

// ===== NEW: GeoJSON vector layer (real-time earthquakes) =====
//Create a vector source for GeoJSON from a URL
var geojsonSource2 = new ol.source.Vector({
url: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',
format: new ol.format.GeoJSON()
});

//Create a vector layer to display the GeoJSON data
var geojsonLayer2 = new ol.layer.Vector({
title: 'Earthquake',
source: geojsonSource2,
style: new ol.style.Style({
image: new ol.style.Circle({
radius: 5,
fill: new ol.style.Fill({ color: 'red' }),
stroke: new ol.style.Stroke({
color: 'black',
width: 1
}) }) }) });

overlaygroup.getLayers().push(geojsonLayer2);

// ===== Map (created after overlaygroup so it can include it) =====
var map = new ol.Map({
target: 'map',
layers: [basegroup, overlaygroup],
view: new ol.View({
center: latlong,
zoom: zoomLevel
})
});

  var layerSwitcher = new ol.control.LayerSwitcher({
tipLabel: 'Legend'
});
map.addControl(layerSwitcher);
</script>
</body>
</html>
